server.port=8080
spring.application.name=campus-alloc-backend

# H2 File mode database under backend/data/
spring.datasource.url=jdbc:h2:file:./data/campus_alloc;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Admin configuration
app.admin.password=admin123

# Solver CLI binary path (relative to backend working directory)
solver.path=../cpp-engine/build/solver.exe
